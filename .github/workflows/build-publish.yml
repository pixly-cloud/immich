name: Build and publish immich-server

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git ref to build (branch, tag or commit)'
        required: true
      image_tag:
        description: 'Override the image tag (default: <version>-pixly.<short-sha>)'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    # The release environment only accepts runs from main or a v* tag (both
    # protected by repository rulesets), so a build can't start from any other
    # branch.
    environment: release
    steps:
      # A tag push builds the protected tag itself. A manual build must name a
      # v* tag or a commit already on main, so nothing unreviewed is published.
      - name: Resolve and check the source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            SOURCE_REF="$GITHUB_REF_NAME"
            SOURCE_SHA="$GITHUB_SHA"
          else
            SOURCE_REF="$INPUT_REF"
            if [[ "$INPUT_REF" == v* ]] && SOURCE_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${INPUT_REF}" --jq '.sha' 2>/dev/null); then
              echo "Building release tag ${INPUT_REF} (${SOURCE_SHA})."
            else
              SOURCE_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${INPUT_REF}" --jq '.sha')
              STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SOURCE_SHA}...main" --jq '.status')
              if [ "$STATUS" != 'ahead' ] && [ "$STATUS" != 'identical' ]; then
                echo "Refusing to build '${INPUT_REF}' (${SOURCE_SHA}): it is not on main and not a v* tag."
                exit 1
              fi
            fi
          fi
          echo "ref=${SOURCE_REF}" >> "$GITHUB_OUTPUT"
          echo "sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      # The server reports its version from server/package.json, so the image tag
      # is derived from that file. Tag pushes publish the bare version; manual
      # builds get a -pixly.<sha> suffix so every build has a unique tag.
      - name: Read server version
        id: version
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          SERVER_VERSION=$(jq -r '.version' server/package.json)
          SOURCE_SHA=$(git rev-parse --short=7 HEAD)
          if [ -n "$IMAGE_TAG" ]; then
            VERSION="$IMAGE_TAG"
          elif [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            VERSION="$SERVER_VERSION"
          else
            VERSION="${SERVER_VERSION}-pixly.${SOURCE_SHA}"
          fi
          echo "server_version=${SERVER_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ghcr.io/pixly-cloud/immich-server:${VERSION} from ${SOURCE_SHA}"

      - name: Check the tag matches the server version
        env:
          IMAGE_TAG: ${{ steps.version.outputs.version }}
          SERVER_VERSION: ${{ steps.version.outputs.server_version }}
        run: |
          if [ "${IMAGE_TAG%%-*}" != "$SERVER_VERSION" ]; then
            echo "Refusing to publish '${IMAGE_TAG}': server/package.json is ${SERVER_VERSION}."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = 'push' ] && [ "${GITHUB_REF_NAME#v}" != "$SERVER_VERSION" ]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match server/package.json (${SERVER_VERSION})."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: server/Dockerfile
          push: true
          # Source metadata for the About dialog: links users to the exact
          # modified source this image was built from (AGPL-3.0 section 13).
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ steps.version.outputs.version }}
            BUILD_SOURCE_REF=${{ steps.source.outputs.ref }}
            BUILD_SOURCE_COMMIT=${{ steps.source.outputs.sha }}
          tags: |
            ghcr.io/pixly-cloud/immich-server:${{ steps.version.outputs.version }}
